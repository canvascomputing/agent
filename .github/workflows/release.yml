name: Publish
on:
  push:
    tags: ['v*']
jobs:
  verify-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require the tagged commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Release tags must point to a commit contained in origin/main"
            exit 1
          fi

  rust-tests:
    needs: verify-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: make test

  python-tests:
    needs: verify-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install './crates/agentwerk-py[test]'
      - run: .venv/bin/python -m pytest crates/agentwerk-py/tests -q -m 'not live'

  crate:
    name: crate dry run
    needs: verify-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p agentwerk --dry-run

  wheels:
    needs: verify-main
    name: wheels ${{ matrix.platform.runner }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
          - { runner: macos-14, target: aarch64 }
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/agentwerk-py
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: auto
          # The aarch64 cross-gcc does not define __ARM_ARCH, which ring's ARM
          # assembly requires. Define it so the crypto backend cross-compiles.
          docker-options: -e CFLAGS_aarch64_unknown_linux_gnu=-D__ARM_ARCH=8
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: crates/agentwerk-py/dist

  sdist:
    needs: verify-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/agentwerk-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: crates/agentwerk-py/dist

  publish-wheels:
    needs: [rust-tests, python-tests, crate, wheels, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Publish the crate only after PyPI succeeds. crates.io versions are immutable,
  # while the wheel and PyPI release can be retried with the same tag.
  publish-crate:
    needs: publish-wheels
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p agentwerk
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
