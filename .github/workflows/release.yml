name: Publish
on:
  push:
    tags: ['v*']
jobs:
  publish-crate:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p agentwerk
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  wheels:
    name: wheels ${{ matrix.platform.runner }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
          - { runner: macos-13, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/agentwerk-py
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: auto
          # The aarch64 cross-gcc does not define __ARM_ARCH, which ring's ARM
          # assembly requires. Define it so the crypto backend cross-compiles.
          docker-options: -e CFLAGS_aarch64_unknown_linux_gnu=-D__ARM_ARCH=8
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: crates/agentwerk-py/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/agentwerk-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: crates/agentwerk-py/dist

  publish-wheels:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
