[package]
name = "agentwerk-py"
version = "0.1.23"
edition = "2021"
license = "MIT"
repository = "https://github.com/canvascomputing/agentwerk"
description = "Python bindings for agentwerk, a minimal crate for building LLM agents"
publish = false

[lib]
name = "_agentwerk"
crate-type = ["cdylib"]

[dependencies]
agentwerk = { path = "../agentwerk" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize = "0.29"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
