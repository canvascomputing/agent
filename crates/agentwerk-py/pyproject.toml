[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "agentwerk"
# Version is read from crates/agentwerk-py/Cargo.toml by maturin, which `make
# bump` keeps in lockstep with the agentwerk crate. One source per side.
dynamic = ["version"]
description = "Python bindings for agentwerk, a minimal crate for building LLM agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.urls]
Repository = "https://github.com/canvascomputing/agentwerk"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: exercises a real LLM provider; skipped unless one is configured",
]

[tool.maturin]
python-source = "python"
module-name = "agentwerk._agentwerk"
features = ["pyo3/extension-module"]
